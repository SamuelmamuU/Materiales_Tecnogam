name: CI Pipeline

on:
  push:
    branches: [ main, master, 'feature/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend CI (NestJS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: apps/backend

      - name: Run Linter
        run: npm run lint
        working-directory: apps/backend

      - name: Run Tests
        run: npm run test
        working-directory: apps/backend

      - name: Build Project
        run: npm run build
        working-directory: apps/backend

  web:
    name: Web CI (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: apps/web

      - name: Run Linter
        run: npm run lint
        working-directory: apps/web

      - name: Build Project
        run: npm run build
        working-directory: apps/web

  mobile:
    name: Mobile CI (Flutter - Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get
        working-directory: apps/mobile

      - name: Run Linter
        run: flutter analyze
        working-directory: apps/mobile

      - name: Run Tests
        run: flutter test
        working-directory: apps/mobile
